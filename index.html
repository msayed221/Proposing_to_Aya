html,body,#root{margin:0;min-height:100%;}
.prop-scene{box-sizing:border-box;position:relative;isolation:isolate;min-height:760px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:32px 16px;background:radial-gradient(ellipse at 15% 20%,#fff6f8,transparent 55%),linear-gradient(145deg,#fbe6ec,#f7d4df);color:#713b50;font-family:'Alexandria','Proposal Emoji',Tahoma,sans-serif;font-weight:600;}
.prop-scene *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
.prop-card{position:relative;z-index:2;width:100%;max-width:510px;padding:30px 28px 26px;border:0;border-radius:36px;background:#fffafbf0;text-align:center;box-shadow:0 18px 60px #9e4a6518;}
.prop-rose{font-size:42px;line-height:1.5;animation:prop-sway 5s ease-in-out infinite;}
.prop-opening{font-size:clamp(14px,3.7vw,17px);line-height:2;margin:12px 0 0;}
.prop-sub{max-width:340px;margin:8px auto;font-size:12px;line-height:2.1;color:#987082;}
.prop-question{font-family:inherit;font-size:clamp(28px,7.5vw,38px);font-weight:600;line-height:1.7;margin:22px 0 12px;color:#71344c;}
.prop-question>span{font-size:25px;vertical-align:middle;}
.prop-arena{position:relative;height:230px;direction:ltr;}
.prop-scene button{font-family:inherit;font-weight:600;cursor:pointer;line-height:1.9;touch-action:manipulation;}
.prop-think.is-hidden{opacity:0;visibility:hidden;pointer-events:none;box-shadow:none;transition:left .42s,top .42s,transform .42s,opacity .42s,visibility 0s .42s;}
.prop-think,.prop-yes{position:absolute;z-index:4;left:50%;width:min(100%,240px);height:72px;min-width:0;min-height:0;padding:5px 3px;border:1px solid #b9587c;border-radius:22px;background:linear-gradient(135deg,#be6688,#a94870);color:#fff;font-size:12px;direction:rtl;transform:translateX(-50%);transform-origin:center center;box-shadow:0 7px 0 #87334f,0 10px 16px #9e4a6520;}
.prop-yes{top:12px;}
.prop-think{top:108px;transition:left .42s cubic-bezier(.2,.8,.2,1),top .42s cubic-bezier(.2,.8,.2,1),transform .42s cubic-bezier(.2,.8,.2,1),opacity .42s,box-shadow .14s;}
.prop-scene button:focus-visible{outline:3px solid #74364e;outline-offset:4px;}
.prop-emojis{display:block;line-height:1.5;font-size:21px;white-space:nowrap;}
.prop-emojis img{display:inline-block!important;height:1em;width:1em;vertical-align:-.12em;margin:0 2px;object-fit:contain;}
.prop-chat{display:flex;align-items:flex-start;gap:10px;min-height:94px;border-top:1px solid #ecd4de;padding-top:18px;margin-top:20px;text-align:right;opacity:0;transition:opacity .3s;}
.prop-chat.is-visible{opacity:1;}
.prop-avatar{flex:0 0 32px;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#b85d80;color:#fff;font:600 14px Arial,sans-serif;box-shadow:0 3px 8px #a84d6b20;}
.prop-note{position:relative;max-width:calc(100% - 42px);margin:0;padding:12px 14px;border-radius:16px 4px 16px 16px;background:#f7e5ed;color:#874c65;font-size:12px;line-height:2;animation:prop-message .3s ease-out;}
.prop-note:before{content:'';position:absolute;right:-6px;top:0;border-top:9px solid #f7e5ed;border-right:7px solid transparent;}
.prop-garden{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:.6;z-index:0;}
.prop-garden img{position:absolute;animation:prop-drift 7s ease-in-out infinite alternate;transform-origin:50% 85%;}
.prop-sticker{display:block;width:min(100%,270px);margin:18px auto 22px;border-radius:20px;box-shadow:0 12px 28px #86405b25;}
.prop-final-title{font-size:clamp(20px,5.5vw,28px);line-height:1.8;margin:0 0 12px;font-weight:600;}
.prop-final{padding-block:30px;}
.prop-final-divider{height:1px;background:#e8cbd7;max-width:160px;margin:24px auto 20px;}
.prop-wedding{font-size:14px;line-height:2.1;margin:0 auto 14px;max-width:350px;}
.prop-receipt{margin:14px auto;padding:14px 10px;max-width:340px;border-radius:18px;background:#f8e9f0;font-size:15px;line-height:2;color:#7f405b;}
.prop-receipt strong{font-size:12px;color:#a16c83;font-weight:600;}
.prop-capture-button{position:relative;margin:12px auto 0;padding:12px 16px;border:1px solid #c98ca4;border-radius:18px;background:#fae5ed;color:#763f56;font-size:11px;max-width:100%;}
.prop-inline-emojis{white-space:nowrap;}
.prop-inline-emojis img{display:inline-block!important;width:1.2em;height:1.2em;vertical-align:-.2em;margin-inline:2px;object-fit:contain;}
.prop-burst{position:absolute;inset:0;z-index:20;overflow:hidden;pointer-events:all;animation:prop-veil 3.7s ease-in-out both;}
.prop-burst img{position:absolute;left:var(--ox);top:var(--oy);width:clamp(95px,17vw,205px);height:clamp(115px,21vw,235px);object-fit:contain;animation:prop-bloom 1s cubic-bezier(.15,.6,.28,1) both,prop-leave .9s ease-in forwards;animation-delay:var(--delay),var(--leave);}
@keyframes prop-bloom{0%{left:var(--ox);top:var(--oy);transform:translate(-50%,-50%) scale(.06) rotate(0);opacity:0;}15%{opacity:1;}100%{left:var(--tx);top:var(--ty);transform:translate(-50%,-50%) scale(1.35) rotate(var(--rot));opacity:1;}}
@keyframes prop-leave{from{left:var(--tx);top:var(--ty);transform:translate(-50%,-50%) scale(1.35) rotate(var(--rot));opacity:1;}to{left:var(--tx);top:var(--ty);transform:translate(-50%,-130%) scale(1.7) rotate(calc(var(--rot) + 40deg));opacity:0;}}
@keyframes prop-veil{0%,4%{background:#fbe6ec00;}27%,38%{background:#fbe6ecf2;}92%,100%{background:#fbe6ec00;}}
@keyframes prop-drift{from{transform:translate(-7px,-10px) rotate(-13deg);}to{transform:translate(10px,16px) rotate(14deg);}}
@keyframes prop-sway{50%{transform:rotate(8deg);}}
@keyframes prop-pop{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
@keyframes prop-message{from{opacity:0;transform:translateX(10px) scale(.94);}to{opacity:1;transform:translateX(0) scale(1);}}
@media(max-width:400px){.prop-scene{padding:20px 12px;min-height:730px;}.prop-card{padding:26px 18px 22px;border-radius:28px;}.prop-question{margin-top:18px;}.prop-arena{height:226px;}.prop-wedding{font-size:12px;}.prop-note{font-size:11px;padding:10px 12px;}.prop-final-title{font-size:21px;}}
@media(prefers-reduced-motion:reduce){.prop-scene *{animation:none!important;transition:none!important;}.prop-burst{background:#fbe6ec;}.prop-burst img{left:var(--tx);top:var(--ty);transform:translate(-50%,-50%);}}

.prop-rose>img{display:inline-block;width:1em;height:1em;object-fit:contain;}

.prop-share-hint{margin:10px auto 0;font-size:12px;line-height:1.9;color:#8a5670;}

.prop-think.is-pressing{box-shadow:0 1px 0 #87334f,inset 0 4px 8px #a24d6e28;transition:transform .14s,box-shadow .14s;}

function pickSpot(scene, yes, width, height, step) {
  const s=scene.getBoundingClientRect();
  const blockers=[yes,...scene.querySelectorAll('.prop-opening,.prop-sub,.prop-question,.prop-rose,.prop-chat')].map(el=>{const r=el.getBoundingClientRect();return {x:r.left-s.left-12,y:r.top-s.top-12,w:r.width+24,h:r.height+24};});
  const candidates=[];
  for(let row=0;row<=12;row++)for(let col=0;col<=8;col++){
    const x=12+width/2+(s.width-width-24)*col/8,y=12+height/2+(s.height-height-24)*row/12;
    if(blockers.every(r=>x+width/2<r.x||x-width/2>r.x+r.w||y+height/2<r.y||y-height/2>r.y+r.h))candidates.push({x,y});
  }
  const prev=scene.querySelector('.prop-think').getBoundingClientRect();
  const px=prev.left-s.left+prev.width/2,py=prev.top-s.top+prev.height/2;
  const ranked=candidates.map((p,i)=>({...p,score:Math.hypot(p.x-px,p.y-py)+(Math.sin((i+1)*(step+3)*17)*.5+.5)*Math.min(s.width,s.height)})).sort((a,b)=>b.score-a.score);
  return ranked[0]||{x:s.width/2,y:s.height-height/2-12};
}
